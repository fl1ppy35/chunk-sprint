<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chunk Sprint</title>
<meta name="description" content="Inglês em blocos de frase, com repetição espaçada, para a família praticar todo dia.">
<meta name="theme-color" content="#F4F6F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12161C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chunk Sprint">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <h1>Chunk Sprint</h1>
        <span class="tag">Inglês em blocos</span>
      </div>
      <div class="topbar-actions">
        <div class="profile-switch" id="profileSwitch"></div>
        <div class="streak-pill" id="streakPill">🔥 0</div>
        <button class="icon-btn" id="settingsBtn" title="Voz, áudio e microfone" aria-label="Voz, áudio e microfone">⚙️</button>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab-btn" data-route="hoje">Hoje</button>
      <button class="tab-btn" data-route="baralho">Baralho</button>
      <button class="tab-btn" data-route="progresso">Progresso</button>
      <button class="tab-btn" data-route="metodo">Método</button>
    </nav>
  </div>
  <div class="view" id="view"><noscript><div class="card">O Chunk Sprint precisa de JavaScript ligado.</div></noscript></div>
</div>

<!-- conteúdo: um arquivo por baralho; perfis: js/profiles.js -->
<script src="js/decks/viagem.js"></script>
<script src="js/decks/negocios.js"></script>
<script src="js/decks/games.js"></script>
<script src="js/decks/negocios2.js"></script>
<script src="js/decks/games2.js"></script>
<script src="js/decks/cultura.js"></script>
<script src="js/dialogos.js"></script>
<script src="js/profiles.js"></script>
<script src="js/migracao.js"></script>
<script src="js/app.js"></script>
<script>
  if('serviceWorker' in navigator && location.protocol === 'https:'){
    navigator.serviceWorker.register('sw.js').catch(function(){});
  }
</script>
</body>
</html>
